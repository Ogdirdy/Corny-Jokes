<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
    <title>Random Joke Generator</title>
</head>
<body>

    <div id="joke-box">
        <div id="spinner"></div>
        <div id="setup">Click the button to get a joke!</div>
        <div id="punchline"></div>
        <button id="revealBtn" onclick="revealPunchline()" style="display: none;">Reveal Punchline</button>
        <br>
        <button onclick="getJoke()">Get Another Joke</button>
    </div>

    <script>
        async function getJoke() {
            showLoading(true);
            document.getElementById("setup").textContent = "";
            document.getElementById("punchline").style.display = "none";
            document.getElementById("revealBtn").style.display = "none";

            try {
                const response = await fetch("https://official-joke-api.appspot.com/random_joke");
                const joke = await response.json();

                document.getElementById("setup").textContent = joke.setup;
                document.getElementById("punchline").textContent = joke.punchline;
                document.getElementById("revealBtn").style.display = "inline-block";
            } catch (error) {
                document.getElementById("setup").textContent = "Failed to load a joke.";
                console.error("Error:", error);
            } finally {
                showLoading(false);
            }
        }

        function revealPunchline() {
            document.getElementById("punchline").style.display = "block";
            document.getElementById("revealBtn").style.display = "none";
        }

        function showLoading(state) {
            document.getElementById("spinner").style.display = state ? "block" : "none";
        }
    </script>

</body>
</html>
